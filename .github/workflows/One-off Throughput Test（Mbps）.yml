name: One-off Throughput Test（Mbps）
on:
  workflow_dispatch:
    inputs:
      target_ip:
        description: '待测IP'
        required: true
        default: '191.222.212.77'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: "吞吐测试(同Stage 2.7逻辑)"
        run: |
          ip="${{ github.event.inputs.target_ip }}"
          result=$(curl -s -o /dev/null -w "%{size_download} %{time_total} %{speed_download}" \
            --resolve "speed.cloudflare.com:443:${ip}" \
            --speed-limit 1000000 --speed-time 3 \
            -m 12 \
            "https://speed.cloudflare.com/__down?bytes=5000000")
          size=$(echo "$result" | awk '{print $1}')
          time_total=$(echo "$result" | awk '{print $2}')
          speed_download=$(echo "$result" | awk '{print $3}')
          mbps=$(awk -v s="$speed_download" 'BEGIN { printf "%.2f", (s + 0) * 8 / 1000000 }')
          echo "IP: ${ip}"
          echo "size_download: ${size} bytes"
          echo "time_total: ${time_total} s"
          echo "speed_download: ${speed_download} B/s"
          echo "计算得出: ${mbps} Mbps"
